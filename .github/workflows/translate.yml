name: 翻訳バッチを送信

on:
  workflow_dispatch:
    inputs:
      page_id:
        description: 'Page ID for new requests (empty: all configured pages)'
        type: string
        required: false
      limit:
        description: 'Maximum new translation units to submit'
        type: string
        required: true
        default: '20'
      refresh:
        description: 'Refresh machine translations marked as needing review'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: documentation-translation
  cancel-in-progress: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  submit:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Restore durable Batch API state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          bash apps/build-docs/translation-preview/batch-state.sh restore
      - name: Check translation limit
        env:
          UNIT_LIMIT: ${{ inputs.limit }}
        run: |
          if ! [[ "$UNIT_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo 'The translation limit must be a positive integer.' >&2
            exit 1
          fi
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test translation pipeline
        run: pnpm docs:ja:test
      - name: Prepare current source snapshot
        run: pnpm docs:ja:build
      - name: Submit Gemini Batch API jobs
        id: translation
        timeout-minutes: 30
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          BATCH_STATE_CHECKPOINT: '1'
          PAGE_ID: ${{ inputs.page_id }}
          UNIT_LIMIT: ${{ inputs.limit || '20' }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'Set the repository Actions variable or secret GEMINI_API_KEY.' >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "$GEMINI_API_KEY"
          args=(--limit "$UNIT_LIMIT")
          if [ -n "$PAGE_ID" ]; then args+=(--page "$PAGE_ID"); fi
          if [ "$REFRESH" = true ]; then args+=(--refresh); fi
          pnpm docs:ja:translate --submit-only "${args[@]}"
      - name: Summarize translation progress
        if: always() && (steps.translation.outcome == 'success' || steps.translation.outcome == 'failure')
        continue-on-error: true
        env:
          TRANSLATION_OUTCOME: ${{ steps.translation.outcome }}
        run: pnpm docs:ja:status
      - name: Preserve batch jobs and submission report
        if: always() && (steps.translation.outcome == 'success' || steps.translation.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: translation-submission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            i18n/batches/*.json
            .generated/translation-status/status.json
            .generated/translation-status/status.md
          if-no-files-found: error
          include-hidden-files: true # Only the explicit translation/report paths above.
          retention-days: 30
      - name: Checkpoint Batch API jobs on the state branch
        if: always() && (steps.translation.outcome == 'success' || steps.translation.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          bash apps/build-docs/translation-preview/batch-state.sh save
      - name: Report submission failure
        if: steps.translation.outcome == 'failure'
        run: |
          echo '翻訳バッチの送信に失敗しました。実行ログと専用ブランチのバッチ台帳を確認してください。' >&2
          exit 1
